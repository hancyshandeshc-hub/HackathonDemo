<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Demo Site — Chat Widget</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1C1E1B;
    background: #FAF9F6;
  }
  header {
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #E4E1D8;
  }
  header .logo { font-weight: 700; font-size: 18px; }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 80px 24px;
    text-align: center;
  }
  main h1 { font-size: 32px; margin-bottom: 12px; }
  main p { font-size: 16px; color: #57534A; line-height: 1.6; }
  .hint {
    margin-top: 48px;
    font-size: 13.5px;
    color: #8A867B;
  }
</style>
</head>
<body>

<header>
  <div class="logo">YourCompany</div>
  <div>Home · Product · Pricing</div>
</header>

<main>
  <h1>This is your website</h1>
  <p>
    The chat widget in the bottom-right corner is a self-contained embed —
    drop <code>widget.css</code> and <code>widget.js</code> onto any page
    and it appears here, ready to talk to visitors.
  </p>
  <p class="hint">Click the bubble in the bottom-right corner to try it →</p>
</main>

<!-- ===== Chat widget embed — just these two lines ===== -->
<link rel="stylesheet" href="widget.css" />
<script>
  // Optional: override defaults before the widget script loads
  window.CW_CONFIG = {
    apiUrl: "/api/chat",
    title: "YourCompany Assistant",
    subtitle: "Ask us anything",
    greeting: "Hi! I'm here to help — what would you like to know?",
  };
</script>
<script src="widget.js"></script>

</body>
</html>
